apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: kafka-at-least-once-source
  annotations:
    camel.apache.org/kamelet.support.level: Preview
    camel.apache.org/provider: Yape
    camel.apache.org/kamelet.group: Kafka
  labels:
    camel.apache.org/kamelet.type: source
spec:
  definition:
    title: Kafka at-least-once source
    description: >-
      Reads one record at a time from a Kafka topic and commits its offset only after the route that
      uses this source has returned normally (stored or skipped), so a record that was not handled is
      never covered by a later commit. A route that handles an error itself (onException with handled)
      does not return normally to this source, so the commit below never runs for it: that route must
      commit the offset itself, after it has kept the record. If the route retries forever (a dependency is
      down), the offset does not move. The message body is the raw record (bytes), and so is the key
      (the header CamelKafkaKey); the Kafka headers are kept. Nothing is decoded here, so a consumer can store
      the record exactly as it came: the original value is also kept in the exchange property originalValue, because a
      decoder replaces the body and the dead-letter-sink Kamelet stores the bytes. Auto commit is off; the commit is done here for a record the route finishes
      normally.
    required:
      - topic
      - brokers
      - groupId
    type: object
    properties:
      topic:
        title: Topic
        description: The topic to read.
        type: string
      brokers:
        title: Brokers
        description: Kafka bootstrap servers, host:port, comma separated.
        type: string
      groupId:
        title: Consumer group
        description: The consumer group. Use one group per consumer; two projects in one group split the partitions between them.
        type: string
      autoOffsetReset:
        title: Where to start
        description: Where a group with no committed offset starts. earliest reads the topic from its beginning.
        type: string
        default: earliest
        enum:
          - earliest
          - latest
  types:
    out:
      mediaType: application/octet-stream
  dependencies:
    - camel:kafka
  template:
    from:
      id: fromKafka
      uri: kafka
      parameters:
        topic: "{{topic}}"
        brokers: "{{brokers}}"
        groupId: "{{groupId}}"
        autoOffsetReset: "{{autoOffsetReset}}"
        autoCommitEnable: false
        allowManualCommit: true
        breakOnFirstError: true
        keyDeserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
        valueDeserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      steps:
        - setProperty:
            id: keepOriginal
            name: originalValue
            expression:
              simple:
                expression: "${body}"
        - to:
            id: toRoute
            uri: kamelet:sink
        - script:
            id: commitOffset
            expression:
              simple:
                expression: "${header.CamelKafkaManualCommit.commit()}"
